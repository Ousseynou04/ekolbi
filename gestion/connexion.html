    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <title>Accueil</title>
    </head>
    <body>
        
        <main>
            <!-- section d'authentification -->
            <section class="bg-light"> 
                <div class="container p-4">
                    <div class="col-lg-4 col-12 bg-white m-auto border shadow-sm p-4">
                        <div>
                            <h4>Espace Parents et administration</h4>
                            <p class="text-capitalize text-muted">école privée les Bâtisseurs</p>
                            <p class="bg-danger-subtle py-2 px-3 rounded border border-danger-subtle">Adresse e-mail ou mot de passe incorrect.</p>
                        </div>
                        <!-- formulaire d'authentification et de connexion -->
                        <div>
                            <form action="#">
                                <div class="mb-3">
                                    <label for="e-mail" class="form-label">Adresse e-mail</label>
                                    <input type="email" class="form-control" id="e-mail" required>
                                </div>
                                <div class="mb-3">
                                    <label for="MDP" class="form-label">Mot de passe</label>
                                    <input type="password" class="form-control" id="MDP" required>
                                </div>
                                <div class="mb-3">
                                    <a type="submit" href="tableau_de_bord.html" class="btn btn-primary w-100 text-white rounded-3">Se Connecter</a>
                                </div>
                                    <div class="text-center"><a href="/index.html">Retour au site</a></div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
    </html>
