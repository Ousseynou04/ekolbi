    <title>page eleve-form</title>
</head>
<body class="bg-light">

            <nav class="navbar navbar-expand-sm navbar-dark bg-dark">

                    <a class="navbar-brand fw-bold mt-1 ms-3" href="#">ekolbi.Gestion</a>

                        </div>

        <section>
                <div class="container p-4">
                    <h2 class="mb-3">inscrire un élève</h2>
                    <!-- formulaire d'inscription eleve -->
                        <div class="bg-white">
                            <form action="#">
                                <div class="border p-4 rounded-3">
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                            <label for="prenom" class="form-label">prénom</label>
                                            <input type="text" class="form-control" id="prenom" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="nom" class="form-label">nom</label>
                                            <input type="text" class="form-control" id="nom" required>
                                        </div>
                                    </div>

                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                            <label for="sexe" class="form-label">Sexe</label>
                                            <select class="form-select py-2" id="sexe" required>
                                                <option value="Garçon" selected>Garçon</option>
                                                <option value="Fille">Fille</option>
                                            </select>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="date" class="form-label">date</label>
                                            <input type="date" class="form-control" id="date">
                                        </div>
                                    </div>

                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6"> 
                                            <label for="classe" class="form-label">classe</label>
                                            <select class="form-select py-2" id="classe" required>
                                                <option value="classe">Choisir une classe</option>
                                                <option value="CIA" selected>CIA</option>
                                                <option value="CIB">CIB</option>
                                                <option value="CPA">CPA</option>
                                                <option value="CPB">CPB</option>
                                                <option value="CE1A">CE1A</option>
                                                <option value="CE1B">CE1B</option>
                                                <option value="CE2A">CE2A</option>
                                                <option value="CE2B">CE2B</option>
                                                <option value="CM1A">CM1A</option>
                                                <option value="CM1B">CM1B</option>
                                                <option value="CM2A">CM2A</option>
                                                <option value="CM2B">CM2B</option>
                                            </select>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="prenom" class="form-label">parent</label>
                                            <select class="form-select py-2" id="prenom" required>
                                                <option value="name" selected>Khady Sy</option>
                                                <option value="name">Lamine Thiam</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <button type="submit" href="#" class="btn btn-primary rounded-3">Enregistrer</button>
                                        <button type="reset" href="#" class="btn btn-outline-primary rounded-3">Annuler</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
            </section>
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
